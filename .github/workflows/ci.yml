name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore YambGame.sln

      - name: Build
        run: dotnet build YambGame.sln -c Release --no-restore

      - name: Test
        run: dotnet test YambGame.sln -c Release --no-build --logger "console;verbosity=normal"
